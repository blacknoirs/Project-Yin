<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yin — Scripts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #070707;
            color: #eeeeee;
            font-family: Inter, Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        ::selection {
            background: #a90d2f;
            color: white;
        }

        /* Background */

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(190, 15, 50, 0.075),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(190, 15, 50, 0.045),
                    transparent 25%
                );
        }

        /* Header */

        header {
            width: 100%;
            height: 72px;

            border-bottom: 1px solid #181818;

            display: flex;
            align-items: center;

            background: rgba(7, 7, 7, 0.88);
            backdrop-filter: blur(14px);

            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-inner {
            width: 100%;
            max-width: 1120px;

            margin: auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        /*
            Proper minimal Yin-Yang symbol.
            No weird AI-looking logo.
        */

        .yin-yang {
            width: 31px;
            height: 31px;

            border-radius: 50%;

            position: relative;

            background: #e5e5e5;

            overflow: hidden;

            transform: rotate(0deg);

            box-shadow:
                0 0 0 1px #292929,
                0 0 22px rgba(220, 20, 55, 0.12);
        }

        .yin-yang::before {
            content: "";

            position: absolute;

            width: 50%;
            height: 100%;

            left: 0;
            top: 0;

            background: #080808;

            border-radius:
                100% 0 0 100% /
                50% 0 0 50%;
        }

        .yin-yang::after {
            content: "";

            position: absolute;

            width: 50%;
            height: 50%;

            left: 25%;
            top: 0;

            background: #080808;

            border-radius: 50%;

            box-shadow:
                0 15.5px 0 0 #e5e5e5;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .brand-name span {
            color: #b91236;
        }

        .header-right {
            font-size: 12px;
            color: #555;
        }

        /* Main */

        main {
            width: 100%;
            max-width: 1120px;

            margin: auto;

            padding: 55px 24px 80px;

            position: relative;
        }

        .intro {
            margin-bottom: 32px;
        }

        .intro-small {
            color: #8a8a8a;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 1.8px;
            text-transform: uppercase;

            margin-bottom: 10px;
        }

        .intro h1 {
            margin: 0;

            font-size: 35px;
            line-height: 1.1;

            letter-spacing: -1.5px;

            font-weight: 750;
        }

        .intro p {
            margin: 10px 0 0;

            max-width: 560px;

            color: #666;

            font-size: 13px;
            line-height: 1.6;
        }

        /* Search */

        .search-wrap {
            margin-bottom: 22px;

            position: relative;
        }

        .search {
            width: 100%;
            height: 44px;

            padding: 0 14px 0 42px;

            border-radius: 8px;

            border: 1px solid #1c1c1c;

            outline: none;

            background: #0c0c0c;

            color: #eee;

            font-size: 13px;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .search:focus {
            border-color: #3b1720;
            background: #0e0e0e;
        }

        .search::placeholder {
            color: #4d4d4d;
        }

        .search-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #555;

            font-size: 14px;

            pointer-events: none;
        }

        /* Grid */

        #scripts {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;
        }

        /* Script */

        .script {
            min-width: 0;

            background: #0c0c0c;

            border: 1px solid #1a1a1a;

            border-radius: 9px;

            overflow: hidden;

            transition:
                border-color 0.15s ease,
                transform 0.15s ease;
        }

        .script:hover {
            border-color: #292929;
            transform: translateY(-1px);
        }

        .script-head {
            padding: 17px 17px 14px;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 15px;
        }

        .script-info {
            min-width: 0;
        }

        .script-name {
            margin: 0;

            font-size: 14px;
            font-weight: 700;

            letter-spacing: -0.15px;
        }

        .script-description {
            margin-top: 6px;

            color: #606060;

            font-size: 12px;
            line-height: 1.45;
        }

        .tag {
            flex-shrink: 0;

            padding: 4px 7px;

            border-radius: 5px;

            background: #17090d;

            border: 1px solid #2c1018;

            color: #b91c3d;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 0.7px;

            text-transform: uppercase;
        }

        /* Code */

        .code-wrap {
            border-top: 1px solid #171717;
            border-bottom: 1px solid #171717;

            background: #080808;
        }

        pre {
            margin: 0;

            padding: 14px 16px;

            min-height: 82px;
            max-height: 230px;

            overflow: auto;

            color: #a9a9a9;

            font-family:
                "Cascadia Code",
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 11px;
            line-height: 1.6;

            white-space: pre-wrap;
            word-break: break-word;
        }

        pre::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        pre::-webkit-scrollbar-track {
            background: #080808;
        }

        pre::-webkit-scrollbar-thumb {
            background: #252525;
            border-radius: 10px;
        }

        /* Actions */

        .actions {
            padding: 10px;

            display: flex;
            justify-content: flex-end;
        }

        .copy {
            height: 31px;

            padding: 0 12px;

            border-radius: 6px;

            border: 1px solid #272727;

            background: #151515;

            color: #c8c8c8;

            font-size: 11px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.12s ease,
                border-color 0.12s ease,
                color 0.12s ease;
        }

        .copy:hover {
            background: #1b1b1b;
            border-color: #363636;
            color: white;
        }

        .copy.copied {
            background: #250b12;
            border-color: #591323;
            color: #d62a50;
        }

        /* Empty */

        .empty {
            display: none;

            padding: 50px 0;

            text-align: center;

            color: #444;

            font-size: 12px;
        }

        /* Footer */

        footer {
            margin-top: 30px;

            color: #3d3d3d;

            font-size: 10px;

            text-align: center;
        }

        /* Mobile */

        @media (max-width: 720px) {
            header {
                height: 64px;
            }

            .header-inner {
                padding: 0 16px;
            }

            .header-right {
                display: none;
            }

            main {
                padding: 38px 16px 60px;
            }

            .intro h1 {
                font-size: 29px;
            }

            #scripts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="background"></div>

<header>
    <div class="header-inner">

        <div class="brand">
            <div class="yin-yang"></div>

            <div class="brand-name">
                <span>YIN</span> / SCRIPTS
            </div>
        </div>

        <div class="header-right">
            SCRIPT LIBRARY
        </div>

    </div>
</header>


<main>

    <section class="intro">

        <div class="intro-small">
            Project Yin
        </div>

        <h1>Scripts</h1>

        <p>
            Private collection of scripts and utilities.
            Select a script and copy it directly.
        </p>

    </section>


    <div class="search-wrap">

        <span class="search-icon">⌕</span>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search scripts..."
            autocomplete="off"
        >

    </div>


    <section id="scripts"></section>

    <div id="empty" class="empty">
        No scripts found.
    </div>


    <footer>
        Yin Script Library
    </footer>

</main>


<script>

let scripts = [];

const container = document.getElementById("scripts");
const search = document.getElementById("search");
const empty = document.getElementById("empty");


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function render() {

    const query =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        scripts.filter(script => {

            const text = `
                ${script.name}
                ${script.category}
                ${script.description}
                ${script.code}
            `.toLowerCase();

            return text.includes(query);

        });


    container.innerHTML = "";


    filtered.forEach((script, index) => {

        const card =
            document.createElement("article");

        card.className = "script";


        card.innerHTML = `

            <div class="script-head">

                <div class="script-info">

                    <h2 class="script-name">
                        ${escapeHTML(script.name)}
                    </h2>

                    <div class="script-description">
                        ${escapeHTML(script.description || "")}
                    </div>

                </div>

                <div class="tag">
                    ${escapeHTML(script.category || "SCRIPT")}
                </div>

            </div>


            <div class="code-wrap">

                <pre>${escapeHTML(script.code)}</pre>

            </div>


            <div class="actions">

                <button
                    class="copy"
                    data-index="${index}"
                >
                    Copy
                </button>

            </div>

        `;


        const button =
            card.querySelector(".copy");


        button.addEventListener("click", async () => {

            try {

                await navigator.clipboard.writeText(
                    script.code
                );

                button.textContent = "Copied";
                button.classList.add("copied");


                setTimeout(() => {

                    button.textContent = "Copy";
                    button.classList.remove("copied");

                }, 1000);


            } catch {

                button.textContent = "Failed";

                setTimeout(() => {
                    button.textContent = "Copy";
                }, 1000);

            }

        });


        container.appendChild(card);

    });


    empty.style.display =
        filtered.length === 0
            ? "block"
            : "none";

}


search.addEventListener(
    "input",
    render
);


fetch("scripts.json")
    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Could not load scripts.json"
            );
        }

        return response.json();

    })
    .then(data => {

        scripts = data;

        render();

    })
    .catch(error => {

        container.innerHTML = "";

        empty.textContent =
            error.message;

        empty.style.display = "block";

    });

</script>

</body>
</html>
