<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Yin Script Vault</title>
<style>
:root{--bg:#070707;--panel:#111;--panel2:#171717;--red:#d7193f;--red2:#ff3158;--text:#f5f5f5;--muted:#929292;--border:#292929}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 18% 15%,rgba(215,25,63,.16),transparent 28%),radial-gradient(circle at 82% 85%,rgba(215,25,63,.09),transparent 30%),var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{max-width:1180px;margin:auto;padding:34px 24px 20px;display:flex;align-items:center;gap:16px}.logo{width:58px;height:58px;border-radius:50%;position:relative;overflow:hidden;background:var(--red);border:2px solid #fff;box-shadow:0 0 35px rgba(215,25,63,.3)}.logo:before{content:"";position:absolute;inset:0;background:#080808;clip-path:ellipse(50% 100% at 50% 0%)}.logo:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:11px;left:20px;box-shadow:0 18px 0 var(--red)}h1{margin:0;font-size:28px;letter-spacing:-.8px}.sub{color:var(--muted);margin-top:4px;font-size:14px}main{max-width:1180px;margin:auto;padding:10px 24px 60px}.toolbar{display:flex;gap:10px;margin:15px 0 24px}input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:white;outline:none}input:focus{border-color:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.card{background:linear-gradient(145deg,#151515,#0d0d0d);border:1px solid var(--border);border-radius:16px;overflow:hidden}.cardTop{padding:19px 19px 12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(215,25,63,.12);color:#ff607d;font-size:11px;font-weight:700;text-transform:uppercase}h2{margin:11px 0 5px;font-size:19px}.desc{color:var(--muted);font-size:13px;line-height:1.5;min-height:40px}pre{margin:0;padding:15px;background:#070707;color:#ddd;border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:auto;max-height:300px;font:12px/1.55 "Cascadia Code",Consolas,monospace;white-space:pre-wrap;word-break:break-word}.actions{display:flex;gap:9px;padding:13px}button{border:1px solid var(--border);background:#191919;color:white;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:600}button:hover{border-color:#444}.copy{background:var(--red);border-color:var(--red)}.copy:hover{background:var(--red2);border-color:var(--red2)}.empty{color:var(--muted);text-align:center;padding:50px;display:none}footer{text-align:center;color:#555;font-size:12px;margin-top:35px}@media(max-width:600px){header{padding:24px 16px 15px}main{padding:8px 16px 40px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo"></div><div><h1>Yin Script Vault</h1><div class="sub">A simple JSON-powered Roblox script library</div></div></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="Search scripts..." autocomplete="off"></div><section id="grid" class="grid"></section><div id="empty" class="empty">No scripts found.</div><footer>Scripts are loaded from scripts.json — edit the JSON to add or update entries.</footer></main>
<script>
const grid=document.getElementById("grid"),search=document.getElementById("search"),empty=document.getElementById("empty");let scripts=[];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function render(){const t=search.value.trim().toLowerCase(),f=scripts.filter(s=>`${s.name} ${s.category} ${s.description} ${s.code}`.toLowerCase().includes(t));window.visibleScripts=f;grid.innerHTML=f.map((s,i)=>`<article class="card"><div class="cardTop"><span class="badge">${esc(s.category||"Script")}</span><h2>${esc(s.name)}</h2><div class="desc">${esc(s.description||"")}</div></div><pre>${esc(s.code)}</pre><div class="actions"><button class="copy" onclick="copyScript(${i})">Copy Script</button></div></article>`).join("");empty.style.display=f.length?"none":"block"}
async function copyScript(i){try{await navigator.clipboard.writeText(window.visibleScripts[i].code);const b=document.querySelectorAll(".copy")[i],old=b.textContent;b.textContent="Copied";setTimeout(()=>b.textContent=old,900)}catch{alert("Clipboard access failed. Copy the code manually.")}}
search.addEventListener("input",render);fetch("scripts.json").then(r=>{if(!r.ok)throw Error("scripts.json could not be loaded");return r.json()}).then(d=>{scripts=Array.isArray(d)?d:[];render()}).catch(e=>{grid.innerHTML=`<div class="empty" style="display:block">${esc(e.message)}</div>`});
</script>
</body>
</html>
